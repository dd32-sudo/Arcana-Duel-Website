<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcana Duel · Feedback</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1428;
            background-image: radial-gradient(circle at 70% 30%, #122e8a, #030814);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Garamond', serif;
            padding: 30px;
        }

        .main-card {
            max-width: 900px;
            width: 100%;
            background: rgba(18, 46, 138, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid #c9a030;
            border-radius: 48px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6);
            padding: 30px 40px;
            color: #f5efea;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 2px solid #c9a030;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .title-section h1 {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #f5efea;
            text-shadow: 0 4px 12px black;
            font-family: 'Garamond', 'Times New Roman', serif;
        }

        .nav a {
            background: transparent;
            color: #f5efea;
            text-decoration: none;
            padding: 10px 24px;
            margin-left: 20px;
            border: 2px solid #c9a030;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .nav a:hover {
            background: #c9a030;
            color: #122e8a;
            box-shadow: 0 0 12px #c9a030;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 400;
            border-bottom: 1px dashed #c9a030;
            padding-bottom: 8px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #f5efea;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #0f1a2f;
            border: 2px solid #c9a030;
            border-radius: 30px;
            color: #f5efea;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #f5efea;
            box-shadow: 0 0 10px #c9a030;
            background: #12223f;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            background: transparent;
            color: #f5efea;
            padding: 14px 32px;
            border: 2px solid #c9a030;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #c9a030;
            color: #122e8a;
            box-shadow: 0 0 15px #c9a030;
        }

        #formMessage {
            margin-top: 20px;
            font-size: 1.1rem;
            min-height: 30px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #c9a030;
            font-style: italic;
            border-top: 1px solid #c9a03060;
            padding-top: 20px;
        }
    </style>
</head>
<body>
<div class="main-card">
    <div class="header">
        <div class="title-section">
            <h1>ARCANA DUEL</h1>
        </div>
        <div class="nav">
            <a href="index.html">HOME</a>
            <a href="feedback.html">FEEDBACK</a>
        </div>
    </div>

    <h2>Share Your Impressions</h2>
    <form id="feedbackForm">
        <div class="form-group">
            <label for="playerName">Your Name</label>
            <input type="text" id="playerName" placeholder="e.g. LinkamTin">
            <div id="nameError" class="error-msg"></div>
        </div>

        <div class="form-group">
            <label for="goodPoints">What did you like most?</label>
            <textarea id="goodPoints" placeholder="Gameplay, art style, card balance..."></textarea>
            <div id="goodError" class="error-msg"></div>
        </div>

        <div class="form-group">
            <label for="improvePoints">What could be improved?</label>
            <textarea id="improvePoints" placeholder="Any suggestions or issues..."></textarea>
            <div id="improveError" class="error-msg"></div>
        </div>

        <div class="button-group">
            <button type="submit">Send Feedback</button>
            <button type="reset">Clear</button>
        </div>
        <div id="formMessage"></div>
    </form>

    <div class="footer">
        ITE3715 — Multimedia Website and Application Design
    </div>
</div>

<script>
    (function() {
        var form = document.getElementById('feedbackForm');
        var nameInput = document.getElementById('playerName');
        var goodInput = document.getElementById('goodPoints');
        var improveInput = document.getElementById('improvePoints');

        var nameError = document.getElementById('nameError');
        var goodError = document.getElementById('goodError');
        var improveError = document.getElementById('improveError');
        var formMessage = document.getElementById('formMessage');

        function clearErrors() {
            nameError.textContent = '';
            goodError.textContent = '';
            improveError.textContent = '';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();
            var valid = true;
            var nameVal = nameInput.value.trim();
            var goodVal = goodInput.value.trim();
            var improveVal = improveInput.value.trim();

            if (nameVal === '') {
                nameError.textContent = 'Please enter your name.';
                valid = false;
            } else if (nameVal.length < 2) {
                nameError.textContent = 'Name must be at least 2 characters.';
                valid = false;
            }

            if (goodVal === '') {
                goodError.textContent = 'Please tell us what you liked.';
                valid = false;
            } else if (goodVal.length < 5) {
                goodError.textContent = 'Please write at least 5 characters.';
                valid = false;
            }

            if (improveVal === '') {
                improveError.textContent = 'Please share any improvement ideas.';
                valid = false;
            } else if (improveVal.length < 5) {
                improveError.textContent = 'Please write at least 5 characters.';
                valid = false;
            }

            if (valid) {
                formMessage.style.color = '#c9a030';
                formMessage.textContent = 'Thank you, ' + nameVal + '! Your voice shapes the fate of Arcana Duel.';
                form.reset();
            } else {
                formMessage.style.color = '#e74c3c';
                formMessage.textContent = 'Please fix the errors above.';
            }
        });

        var resetBtn = form.querySelector('button[type="reset"]');
        resetBtn.addEventListener('click', function() {
            clearErrors();
            formMessage.textContent = '';
        });
    })();
</script>
</body>
</html>
